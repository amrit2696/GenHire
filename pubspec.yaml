name: ghire
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  dio: ^5.10.0
  shimmer: ^4.0.0
  shared_preferences: ^2.5.6
  pretty_dio_logger: ^1.4.0
  # flutter_secure_storage: ^11.2.0
  # flutter_secure_storage_devtool: ^0.3.8
  get_storage: ^2.1.1
  file_picker: ^13.1.0
  printing: ^5.15.1
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/


  fonts:
    - family: PublicSansRegular
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
